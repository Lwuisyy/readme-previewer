<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>README Previewer — Live GitHub Markdown Editor</title>

  <!-- GitHub Markdown CSS (dark) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.6.1/github-markdown-dark.min.css" />
  <!-- Highlight.js dark theme -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />

  <style>
    /* ── Reset & Base ───────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0d1117;
      --surface:  #161b22;
      --border:   #30363d;
      --text:     #e6edf3;
      --muted:    #8b949e;
      --accent:   #0e75b6;
      --accent2:  #1f6feb;
      --green:    #3fb950;
      --red:      #f85149;
      --radius:   8px;
      --font:     -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      --mono:     "JetBrains Mono", "Fira Code", "Cascadia Code", Consolas, monospace;
    }

    html, body {
      height: 100%;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    /* ── Layout ─────────────────────────────────────────── */
    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ── Toolbar ────────────────────────────────────────── */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .toolbar-brand {
      font-weight: 700;
      font-size: 15px;
      color: var(--accent);
      margin-right: 8px;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .toolbar-brand svg { flex-shrink: 0; }

    .toolbar-divider {
      width: 1px;
      height: 24px;
      background: var(--border);
      margin: 0 4px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      font-size: 13px;
      font-family: var(--font);
      font-weight: 500;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .btn:hover {
      background: var(--border);
      border-color: var(--muted);
    }
    .btn:active { transform: scale(0.97); }

    .btn--accent {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .btn--accent:hover {
      background: var(--accent2);
      border-color: var(--accent2);
    }

    .btn--danger {
      color: var(--red);
      border-color: var(--border);
    }
    .btn--danger:hover {
      background: rgba(248, 81, 73, 0.1);
      border-color: var(--red);
    }

    .toolbar-spacer { flex: 1; }

    .char-count {
      font-size: 12px;
      color: var(--muted);
      font-family: var(--mono);
    }

    /* ── Main Panels ────────────────────────────────────── */
    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .panel {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .panel-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    /* ── Editor ─────────────────────────────────────────── */
    .editor-panel {
      width: 50%;
      border-right: 1px solid var(--border);
    }

    #editor {
      flex: 1;
      width: 100%;
      padding: 20px;
      font-family: var(--mono);
      font-size: 14px;
      line-height: 1.7;
      color: var(--text);
      background: var(--bg);
      border: none;
      outline: none;
      resize: none;
      tab-size: 2;
    }

    #editor::placeholder { color: var(--muted); }

    /* ── Preview ────────────────────────────────────────── */
    .preview-panel { flex: 1; }

    #preview {
      flex: 1;
      padding: 32px 40px;
      overflow-y: auto;
      background: var(--bg);
    }

    #preview .markdown-body {
      max-width: 900px;
      margin: 0 auto;
      font-size: 16px;
    }

    /* Override some GitHub CSS for better dark bg */
    #preview .markdown-body img {
      background: transparent !important;
      border-radius: 4px;
    }
    #preview .markdown-body table img {
      background: transparent !important;
    }
    #preview .markdown-body hr {
      border-color: var(--border);
    }
    #preview .markdown-body a {
      color: var(--accent2);
    }
    #preview .markdown-body code {
      background: rgba(110, 118, 129, 0.15);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 85%;
    }
    #preview .markdown-body pre {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    /* ── Scrollbar ──────────────────────────────────────── */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

    /* ── Toast ──────────────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 500;
      color: #fff;
      background: var(--green);
      border-radius: var(--radius);
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.25s ease;
      pointer-events: none;
      z-index: 100;
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* ── Mobile Responsive ──────────────────────────────── */
    @media (max-width: 768px) {
      .main { flex-direction: column; }
      .editor-panel { width: 100%; height: 50%; border-right: none; border-bottom: 1px solid var(--border); }
      .preview-panel { height: 50%; }
      #preview { padding: 20px; }
      .toolbar { gap: 6px; padding: 8px 10px; }
      .btn { padding: 5px 10px; font-size: 12px; }
    }
  </style>
</head>
<body>

<div class="app">
  <!-- ── Toolbar ── -->
  <div class="toolbar">
    <div class="toolbar-brand">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor">
        <path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/>
      </svg>
      README Previewer
    </div>

    <div class="toolbar-divider"></div>

    <button class="btn" onclick="loadFile()" title="Open .md file">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      Open
    </button>

    <button class="btn" onclick="saveFile()" title="Save as .md file">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      Save
    </button>

    <button class="btn btn--accent" onclick="copyMarkdown()" title="Copy markdown to clipboard">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      Copy
    </button>

    <button class="btn btn--danger" onclick="clearEditor()" title="Clear editor">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      Clear
    </button>

    <div class="toolbar-spacer"></div>

    <span class="char-count" id="charCount">0 chars</span>
  </div>

  <!-- ── Main Content ── -->
  <div class="main">
    <!-- Editor Panel -->
    <div class="panel editor-panel">
      <div class="panel-header">
        <span class="panel-dot" style="background: var(--green)"></span>
        Editor — Markdown
      </div>
      <textarea id="editor" placeholder="Paste or type your GitHub README markdown here...&#10;&#10;Tip: You can also click 'Open' to load a .md file." spellcheck="false"></textarea>
    </div>

    <!-- Preview Panel -->
    <div class="panel preview-panel">
      <div class="panel-header">
        <span class="panel-dot" style="background: var(--accent)"></span>
        Preview — GitHub Dark
      </div>
      <div id="preview">
        <div class="markdown-body" id="previewContent"></div>
      </div>
    </div>
  </div>
</div>

<!-- Toast notification -->
<div class="toast" id="toast"></div>

<!-- Hidden file input -->
<input type="file" id="fileInput" accept=".md,.markdown,.txt" style="display:none" />

<!-- ── Scripts ── -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

<script>
  // ── Configure Marked ──────────────────────────────────
  marked.setOptions({
    gfm: true,
    breaks: true,
    highlight: function(code, lang) {
      if (lang && hljs.getLanguage(lang)) {
        try { return hljs.highlight(code, { language: lang }).value; } catch (_) {}
      }
      try { return hljs.highlightAuto(code).value; } catch (_) {}
      return code;
    }
  });

  // ── DOM refs ──────────────────────────────────────────
  const editor       = document.getElementById('editor');
  const previewContent = document.getElementById('previewContent');
  const charCount    = document.getElementById('charCount');
  const fileInput    = document.getElementById('fileInput');
  const toastEl      = document.getElementById('toast');

  // ── Render Markdown ───────────────────────────────────
  function render() {
    const raw = editor.value;
    const html = marked.parse(raw);
    previewContent.innerHTML = DOMPurify.sanitize(html, {
      ADD_TAGS: ['img'],
      ADD_ATTR: ['src', 'alt', 'align', 'width', 'height', 'href', 'target'],
      ALLOW_UNKNOWN_PROTOCOLS: true
    });
    charCount.textContent = `${raw.length.toLocaleString()} chars`;
    localStorage.setItem('readme-looker-content', raw);
  }

  // Debounced render for performance
  let renderTimeout;
  editor.addEventListener('input', () => {
    clearTimeout(renderTimeout);
    renderTimeout = setTimeout(render, 80);
  });

  // ── Tab key support in editor ─────────────────────────
  editor.addEventListener('keydown', (e) => {
    if (e.key === 'Tab') {
      e.preventDefault();
      const start = editor.selectionStart;
      const end   = editor.selectionEnd;
      editor.value = editor.value.substring(0, start) + '  ' + editor.value.substring(end);
      editor.selectionStart = editor.selectionEnd = start + 2;
      render();
    }
  });

  // ── Load File ─────────────────────────────────────────
  function loadFile() {
    fileInput.click();
  }

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      editor.value = ev.target.result;
      render();
      showToast(`Loaded: ${file.name}`);
    };
    reader.readAsText(file);
    fileInput.value = '';  // reset so same file can be re-loaded
  });

  // ── Save File ─────────────────────────────────────────
  function saveFile() {
    const content = editor.value;
    if (!content.trim()) {
      showToast('Nothing to save!', true);
      return;
    }
    const blob = new Blob([content], { type: 'text/markdown;charset=utf-8' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = 'README.md';
    a.click();
    URL.revokeObjectURL(url);
    showToast('Saved README.md');
  }

  // ── Copy to Clipboard ────────────────────────────────
  function copyMarkdown() {
    const content = editor.value;
    if (!content.trim()) {
      showToast('Nothing to copy!', true);
      return;
    }
    navigator.clipboard.writeText(content).then(() => {
      showToast('Copied to clipboard!');
    });
  }

  // ── Clear Editor ─────────────────────────────────────
  function clearEditor() {
    if (editor.value.trim() && !confirm('Clear all content?')) return;
    editor.value = '';
    render();
    showToast('Editor cleared');
  }

  // ── Toast ────────────────────────────────────────────
  let toastTimer;
  function showToast(msg, isError = false) {
    clearTimeout(toastTimer);
    toastEl.textContent = msg;
    toastEl.style.background = isError ? 'var(--red)' : 'var(--green)';
    toastEl.classList.add('show');
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
  }

  // ── Drag & Drop ──────────────────────────────────────
  document.addEventListener('dragover', (e) => e.preventDefault());
  document.addEventListener('drop', (e) => {
    e.preventDefault();
    const file = e.dataTransfer.files[0];
    if (file && /\.(md|markdown|txt)$/i.test(file.name)) {
      const reader = new FileReader();
      reader.onload = (ev) => {
        editor.value = ev.target.result;
        render();
        showToast(`Loaded: ${file.name}`);
      };
      reader.readAsText(file);
    }
  });

  // ── Keyboard Shortcuts ───────────────────────────────
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 's') {
      e.preventDefault();
      saveFile();
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 'o') {
      e.preventDefault();
      loadFile();
    }
  });

  // ── Init: Load from localStorage or show sample ──────
  (function init() {
    const saved = localStorage.getItem('readme-looker-content');
    if (saved) {
      editor.value = saved;
    } else {
      editor.value = `<!-- Paste your GitHub README here -->

<p align="center">
  <img src="https://capsule-render.vercel.app/api?type=waving&height=240&section=header&text=Your+Name&fontSize=58&fontAlignY=32&desc=Your+tagline+here&descAlignY=55&descSize=18&fontColor=ffffff&color=0:0f172a,50:0e75b6,100:1e293b" />
</p>

---

## ✦ About Me
- ⚡ Building useful, clean, and practical projects
- 🧠 Always learning and improving every day

---

## ✦ Tech Stack

<p align="center">
  <img src="https://skillicons.dev/icons?i=python,javascript,html,css,react,nodejs,git,docker" />
</p>

---

<p align="center">
  <i>Start editing on the left to see the live preview here!</i>
</p>
`;
    }
    render();
  })();
</script>

</body>
</html>
